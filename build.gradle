plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.eomoff'
version = '0.0.1-SNAPSHOT'
description = 'mopl'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    // Web (REST API, SSE)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 인증/인가 (JWT, 소셜 로그인)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 영속성 (PostgreSQL + JPA + 스키마 마이그레이션)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10부터 PostgreSQL 지원이 별도 아티팩트
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // 실시간 (같이 보기, 콘텐츠 채팅, DM)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 배치 (콘텐츠 수집) + 모니터링
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 캐시 / 메시징 / 검색 (심화)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // bootRun 시 compose.yaml을 기동하고 접속 정보를 주입
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // 외부 API 실제 호출 테스트: 기본 실행에서 제외
        // 조사가 미확인으로 남긴 항목 검증 시에만 -PincludeExternal 로 활성화
        if (!project.hasProperty('includeExternal')) {
            excludeTags 'external'
        }
    }
    finalizedBy tasks.jacocoTestReport
}

// 커버리지 집계 제외 대상 — 로직이 없어 테스트 대상 아님
def coverageExcludes = [
    '**/dto/**',
    '**/config/**',
    '**/MoplApplication.class'
]

tasks.withType(JacocoReportBase).configureEach {
    dependsOn tasks.test
    classDirectories.setFrom(
        files(sourceSets.main.output.classesDirs).asFileTree.matching {
            exclude coverageExcludes
        }
    )
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true
        html.required = true
    }
}

// 테스트 커버리지 80% 이상 유지
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

// 게이트를 check에 연결 — 미연결 시 ./gradlew build 로 실행되지 않음
tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}
