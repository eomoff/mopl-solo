# 로컬 개발용 인프라
# bootRun 시 spring-boot-docker-compose가 자동 기동하고 접속 정보를 주입
# Kafka·Nginx·app×2는 6주차 로컬 분산 검증 때 distributed 프로파일로 추가
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mopl
      POSTGRES_USER: mopl
      POSTGRES_PASSWORD: mopl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mopl -d mopl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
